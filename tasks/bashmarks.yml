---
- name: "Downloading Bashmarks"
  ansible.builtin.git:
    repo: "https://github.com/vecin2/bashmarks.git"
    dest: "{{ ansible_env.HOME }}/.local/bashmarks"
    update: "no"
- name: "Installing bashmarks"
  ansible.builtin.command: make -C {{ansible_env.HOME}}/.local/bashmarks  install
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/bashmarks.sh"

- name: "Source bashmarks on rc files"
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.profile"
    marker: "#{mark} bashmarks configuration"
    block: |
      . $HOME/.local/bin/bashmarks.sh
      . $HOME/.sdirs
