---
#The key here is to identify the distribution available versions
#which are different from the versions in the nodejs page.
#Check https://github.com/nodesource/distributions

- name: Install Node.js dependencies
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - software-properties-common
- name: Install the gpg key for nodejs LTS
  ansible.builtin.apt_key:
    url: "https://deb.nodesource.com/gpgkey/nodesource.gpg.key"
    state: absent
- name: Download NodeSource's signing key.
  # NodeSource's web server discriminates the User-Agent used by the deb822_repository module.
  # https://github.com/nodesource/distributions/issues/1723
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/signing-key-nodesource-repo.asc
    owner: root
    group: root
    mode: "0444"
  register: node_signing_key
- name: Add NodeSource repositories for Node.js.
  ansible.builtin.deb822_repository:
    name: nodesource_{{ node_version }}
    uris: "https://deb.nodesource.com/node_{{ node_version }}"
    types: deb
    suites: nodistro
    components: main
    signed_by: "{{ node_signing_key.dest }}"
    state: present
  register: node_repo

- name: "Install nodejs"
  ansible.builtin.apt:
    update_cache: true
    name: nodejs
    state: present

