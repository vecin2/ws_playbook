---
- hosts: wsl
  connection: local
  pre_tasks:
    - name: Update repositories
      ansible.builtin.apt:
        update_cache: "yes"
      changed_when: false
      become: true
    - ansible.builtin.import_tasks: tasks/facts.yml
  vars_files:
    - "{{playbook_dir}}/vars.yml"
    - "{{playbook_dir}}/passwords.yml"
  vars:
    ansible_become_pass: "{{sudo_pass}}"

  tasks:
    - ansible.builtin.import_tasks: tasks/desktop.yml
      tags: desktop
    # Basic terminal
    - ansible.builtin.import_tasks: tasks/shell.yml
      tags: shell
    - ansible.builtin.import_tasks: tasks/bashrcs.yml
      tags: bashrcs
    - ansible.builtin.import_tasks: tasks/zsh.yml
      tags: zsh
    #- import_tasks: tasks/mybash_functions.yml
    #  tags: shell
    - ansible.builtin.import_tasks: tasks/ansible.yml
    - ansible.builtin.import_tasks: tasks/nodejs.yml
      become: true
      tags: nodejs
    # - import_tasks: tasks/shell_colors/gruvbox_theme_for_mintty.yml
    - ansible.builtin.import_tasks: tasks/dircolors.yml
    - ansible.builtin.import_tasks: tasks/starship.yml
    - ansible.builtin.import_tasks: tasks/wsl_tasks.yml
      when: "'WSL' in wsl_version"
    - ansible.builtin.import_tasks: tasks/searchers.yml
    - ansible.builtin.import_tasks: tasks/git.yml
      tags: git
    #    - import_tasks: tasks/vim.yml
    - ansible.builtin.import_tasks: tasks/neovim.yml
    - ansible.builtin.import_tasks: tasks/fzf.yml
    - ansible.builtin.import_tasks: tasks/zoxide.yml
    - ansible.builtin.import_tasks: tasks/tmux.yml
      tags: tmux
    - ansible.builtin.import_tasks: tasks/tmuxinator.yml
    - ansible.builtin.import_tasks: tasks/pythondev.yml
      tags: python
    # Java
    - ansible.builtin.import_tasks: tasks/javadev.yml
      tags: java
    # JavaScript
    - ansible.builtin.import_tasks: tasks/javascript.yml
      tags: javascript
    # Yaml
    - ansible.builtin.import_tasks: tasks/yamldev.yml
    - ansible.builtin.import_tasks: tasks/luadev.yml
    - ansible.builtin.import_tasks: tasks/docker.yml
      become: true
      tags: docker
    #- import_tasks: tasks/pywinrm.yml
    - ansible.builtin.import_tasks: tasks/homecloud.yml
      tags: homecloud
