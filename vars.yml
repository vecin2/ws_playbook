myshell: zsh #either zsh or bash
myshellfile: zshrc #either bashrc or zshrc


# Windows for WSL
#Copying nerdfonts into `c:\windows\Fonts` might give permission issues.
#Change nerdfonts path to something that does ont give pemisission error and then copy manually from windows
# fonts_installation_path: "/mnt/c/Windows/fonts"
fonts_installation_path: "{{ansible_env.HOME}}/.fonts"
shell_util_packages:
  - unzip
  - unrar
  - gcc #c compiler require to install tmux from source
  - make #require to install tmux from tar.gz file
  - zip
  - tar
  - curl
  - xclip
  - python-is-python3 #symlink python to python3 so scripts starting with '/usr/bin/env python'
  #- cmake #used by YouCompleteMe (vim plugin)
python_apt_packages:
  - pipx #to install the global python packages
  #- python3.8-venv #require by pylsp
  - python3
  - python3-pip
  #Failure when installin  poetry in an venv environment
  - python3.10-venv
# python_pip_packages:
#   - pipx
  #
#java_apt_packages:
kse_version: 5.5.3 #key store explorer
jd_version: 1.6.6 #java decompiler

desktop_packages:
  - libreoffice
  - nautilus
  - evince

node_version: "22.x"

synology_drive_package_type: deb
synology_drive_version: 3.5.1-{{synology_drive_minor_version}}
synology_drive_minor_version: 16102
synology_drive_download_path: "{{ansible_env.HOME}}/.ansible/tmp/synology-drive-client.deb"
nas_model: "DS423%2B&bays=4"
dsm_version: 7.2
build_number: 72806

